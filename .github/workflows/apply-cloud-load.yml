name: Apply cloud memory loading
on:
  push:
    branches: [fix/load-shared-memories]
    paths: ['scripts/apply-cloud-load.py', '.github/workflows/apply-cloud-load.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/load-shared-memories
      - run: |
          python3 scripts/apply-cloud-load.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/MemoryPalaceApp.tsx
          git commit -m 'Read cloud memories when opening configured memory palace'
          git push origin HEAD:fix/load-shared-memories
