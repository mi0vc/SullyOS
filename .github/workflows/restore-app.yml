name: Restore MemoryPalaceApp from 19c0d63d

on:
  push:
    branches: [master]
    paths: ['.github/workflows/restore-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Restore file content
        run: |
          git show 19c0d63d:apps/MemoryPalaceApp.tsx > apps/MemoryPalaceApp.tsx
          wc -c apps/MemoryPalaceApp.tsx
          head -n 3 apps/MemoryPalaceApp.tsx
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/MemoryPalaceApp.tsx
          git commit -m 'Restore apps/MemoryPalaceApp.tsx to pre-damage content'
          git push origin HEAD:master
