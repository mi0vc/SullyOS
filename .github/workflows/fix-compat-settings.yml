name: Apply and verify memory settings fix
on:
  push:
    branches: [fix/compat-settings-persistence]
    paths: ['scripts/fix-compat-settings.py', '.github/workflows/fix-compat-settings.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compat-settings-persistence
      - name: Apply checked patch
        run: |
          python3 scripts/fix-compat-settings.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/MemoryPalaceApp.tsx utils/memoryPalace/sullyosCompat.test.ts
          git diff --cached --quiet || git commit -m 'Persist shared memory role and login on settings save'
          git push origin HEAD:fix/compat-settings-persistence
